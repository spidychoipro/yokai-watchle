<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="page-title">요괴워치 Watchle · 요괴 맞히기</title>
<meta name="description" id="meta-desc" content="매일 정해진 요괴를 이름으로 맞히는 게임. 랭크·부족·속성 힌트로 요괴 도감을 완성해보세요." />
<meta name="theme-color" content="#171033" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23b48cff'/%3E%3Cstop offset='1' stop-color='%236d4bc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffc857' opacity='0.35'/%3E%3Ccircle cx='50' cy='57' r='27' fill='url(%23g)'/%3E%3Cpolygon points='38,12 30,32 52,28' fill='url(%23g)'/%3E%3Cpolygon points='62,12 70,32 48,28' fill='url(%23g)'/%3E%3Ccircle cx='41' cy='58' r='5' fill='%23ffc857'/%3E%3Ccircle cx='59' cy='58' r='5' fill='%23ffc857'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- 오리지널 마스코트 + UI 아이콘 SVG 스프라이트 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="0.6" stop-color="#8a63ea"/>
      <stop offset="1" stop-color="#5b3a9e"/>
    </linearGradient>
    <radialGradient id="catAura" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0" stop-color="#ffc857" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffc857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <symbol id="i-cat" viewBox="0 0 100 100">
    <circle cx="52" cy="48" r="46" fill="url(#catAura)"/>
    <path d="M50 7 Q54 15 50 23 Q46 15 50 7 Z" fill="#ffc857"/>
    <polygon points="38,12 30,32 52,28" fill="url(#catBody)"/>
    <polygon points="62,12 70,32 48,28" fill="url(#catBody)"/>
    <polygon points="38,17 33,29 46,29" fill="#ffc857"/>
    <polygon points="62,17 67,29 54,29" fill="#ffc857"/>
    <circle cx="50" cy="57" r="27" fill="url(#catBody)"/>
    <path d="M32 64 C32 88 41 97 50 97 C59 97 68 88 68 64 C58 70 42 70 32 64 Z" fill="url(#catBody)"/>
    <path d="M41 80 Q50 75.5 59 80 Q61.5 91 50 95 Q38.5 91 41 80 Z" fill="#e6dbff" opacity="0.35"/>
    <path d="M45 87.5 Q50 91 55 87.5" fill="none" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="40.5" cy="57" r="5.6" fill="#ffc857"/>
    <circle cx="59.5" cy="57" r="5.6" fill="#ffc857"/>
    <circle cx="42.5" cy="55.2" r="1.9" fill="#fff"/>
    <circle cx="61.5" cy="55.2" r="1.9" fill="#fff"/>
    <path d="M48.3 65.5 L51.7 65.5 L50 68 Z" fill="#ffc857"/>
    <path d="M46 70 Q50 73.2 54 70" fill="none" stroke="#4b2f86" stroke-width="2.2" stroke-linecap="round"/>
    <g stroke="#d9c7ff" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M25 59 L34 61"/>
      <path d="M25 67 L34 64.5"/>
      <path d="M75 59 L66 61"/>
      <path d="M75 67 L66 64.5"/>
    </g>
    <circle cx="19" cy="20" r="2.3" fill="#ffc857"/>
    <circle cx="80" cy="15" r="1.7" fill="#ffc857"/>
    <circle cx="87" cy="40" r="2" fill="#ffc857" opacity="0.9"/>
    <circle cx="15" cy="46" r="1.7" fill="#ffc857" opacity="0.8"/>
    <circle cx="84" cy="60" r="1.5" fill="#b48cff"/>
  </symbol>

  <symbol id="i-spark" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2 L14 9.6 L21 12 L14 14.4 L12 22 L10 14.4 L3 12 L10 9.6 Z"/>
  </symbol>

  <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/>
    <path d="M9.3 9.2 a2.9 2.9 0 0 1 5.7 1 c0 1.9 -2.7 2.6 -2.7 3.6"/>
    <circle cx="12" cy="16.8" r="0.4" fill="currentColor"/>
  </symbol>

  <symbol id="i-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3v18h18"/>
    <path d="M8.5 17v-6"/>
    <path d="M13 17V7"/>
    <path d="M17.5 17v-9"/>
  </symbol>

  <symbol id="i-gear" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path fill-rule="evenodd" d="M12 4.2a7.8 7.8 0 1 1 0 15.6 7.8 7.8 0 0 1 0-15.6Zm0 3a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z"/>
    <g><rect x="11" y="0" width="2" height="4.4" rx="1"/><rect x="11" y="19.6" width="2" height="4.4" rx="1"/><rect x="0" y="11" width="4.4" height="2" rx="1"/><rect x="19.6" y="11" width="4.4" height="2" rx="1"/></g>
    <g transform="rotate(22.5 12 12)"><rect x="11" y="0" width="2" height="4.4" rx="1"/><rect x="11" y="19.6" width="2" height="4.4" rx="1"/><rect x="0" y="11" width="4.4" height="2" rx="1"/><rect x="19.6" y="11" width="4.4" height="2" rx="1"/></g>
    <g transform="rotate(45 12 12)"><rect x="11" y="0" width="2" height="4.4" rx="1"/><rect x="11" y="19.6" width="2" height="4.4" rx="1"/><rect x="0" y="11" width="4.4" height="2" rx="1"/><rect x="19.6" y="11" width="4.4" height="2" rx="1"/></g>
    <g transform="rotate(67.5 12 12)"><rect x="11" y="0" width="2" height="4.4" rx="1"/><rect x="11" y="19.6" width="2" height="4.4" rx="1"/><rect x="0" y="11" width="4.4" height="2" rx="1"/><rect x="19.6" y="11" width="4.4" height="2" rx="1"/></g>
  </symbol>

  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M18 6 6 18 M6 6 18 18"/>
  </symbol>
</svg>

<div class="layout">

  <header class="site-header">
    <div class="header-inner">
      <button id="help-btn" class="icon-btn" title="게임 설명" aria-label="게임 설명"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg></button>
      <div class="brand">
        <span class="medal" aria-hidden="true"><span class="medal-core"><svg class="ic-medal"><use href="#i-cat"/></svg></span></span>
        <div class="brand-text">
          <h1 class="brand-title">요괴워치</h1>
          <p class="brand-sub">YO-KAI WATCHLE <svg class="ic-spark" aria-hidden="true"><use href="#i-spark"/></svg> DAILY</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="stats-btn" class="icon-btn" title="통계" aria-label="통계"><svg class="ic" aria-hidden="true"><use href="#i-stats"/></svg></button>
        <button id="settings-btn" class="icon-btn" title="설정" aria-label="설정"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 게임 보드 -->
    <section id="game-board" class="card game-board">
      <p id="mode-info" class="mode-info"></p>
      <div id="guesses-container" class="guesses-container cols-all">
        <div class="guess-header">
          <span class="col-num">№</span>
          <span class="col-name">요괴</span>
          <span class="col-rank">랭크</span>
          <span class="col-tribe">부족</span>
          <span class="col-attr">속성</span>
        </div>
      </div>

      <form id="guess-form" class="guess-form" autocomplete="off">
        <div class="input-wrapper">
          <input
            id="guess-input"
            type="text"
            class="text-input"
            list="yo-kai-list"
            autocomplete="off"
            placeholder="요괴 이름 입력..."
          />
          <datalist id="yo-kai-list"></datalist>
          <ul id="suggestions" class="suggestions hidden"></ul>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">맞혀보기</button>
      </form>
      <button id="new-game-btn" class="link-btn">새 게임</button>
    </section>

    <!-- 게임 결과 -->
    <section id="result-screen" class="card result-screen hidden">
      <div class="result-content">
        <h2 id="result-title" class="result-title"></h2>
        <div class="result-medal" aria-hidden="true">
          <span class="result-medal-core">
            <svg class="ic-medal-lg"><use href="#i-cat"/></svg>
            <span id="result-number" class="result-medal-num"></span>
          </span>
        </div>
        <div class="result-badges">
          <span id="badge-rank" class="badge"></span>
          <span id="badge-tribe" class="badge"></span>
          <span id="badge-attr" class="badge"></span>
        </div>
        <p id="result-name" class="result-name"></p>
        <p id="result-stats-line" class="result-line"></p>
        <div class="result-actions">
          <button id="share-btn" class="btn-primary">공유</button>
          <button id="play-again-btn" class="btn-primary">다시 하기</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p id="footer-text"></p>
      <p class="footer-links">
        <a href="https://github.com/spidychoipro/yokai-watchle" target="_blank">GitHub</a> • 
        <a href="https://spidychoipro.github.io/yokai-watchle" target="_blank">Play</a>
      </p>
    </footer>
  </main>
</div>

<!-- 모달 오버레이 -->
<div id="backdrop" class="modal-backdrop hidden"></div>

<!-- 도움말 -->
<section id="help-modal" class="modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="help-title">
  <button class="modal-close" aria-label="닫기"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-close"/></svg></button>
  <h3 id="help-title">게임 방법</h3>
  <ol class="help-list">
    <li id="help-li-1"></li>
    <li id="help-li-2"></li>
  </ol>
  <div class="help-example" aria-hidden="true">
    <div class="guess-row cols-all">
      <span class="col-num arrow-num" id="help-ex-r1-num">▲ 142</span>
      <span class="col-name" id="help-ex-r1-name">위스퍼</span>
      <span class="col-rank"><span class="cell" id="help-ex-r1-rank" style="background:#8ab6ff;color:#04240f">D ▲</span></span>
      <span class="col-tribe"><span class="cell" id="help-ex-r1-tribe" style="background:#8a63ea;color:#fff">불가사의</span></span>
      <span class="col-attr"><span class="cell correct" id="help-ex-r1-attr">돌풍</span></span>
    </div>
    <div class="guess-row cols-all">
      <span class="col-num">✓</span>
      <span class="col-name" id="help-ex-r2-name">지바냥</span>
      <span class="col-rank"><span class="cell correct" id="help-ex-r2-rank">C</span></span>
      <span class="col-tribe"><span class="cell correct" id="help-ex-r2-tribe">프리티</span></span>
      <span class="col-attr"><span class="cell correct" id="help-ex-r2-attr">화염</span></span>
    </div>
  </div>
  <ul class="help-list" id="help-example-list">
    <li id="help-ex-1"></li>
    <li id="help-ex-2"></li>
    <li id="help-ex-3"></li>
    <li id="help-ex-4"></li>
  </ul>
</section>

<!-- 통계 -->
<section id="stats-modal" class="modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="stats-title">
  <button class="modal-close" aria-label="닫기"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-close"/></svg></button>
  <h3 id="stats-title">통계</h3>
  <div class="stat-grid">
    <div class="stat"><b id="st-played">0</b><span id="lbl-st-played">해결</span></div>
    <div class="stat"><b id="st-streak">0</b><span id="lbl-st-streak">연속</span></div>
    <div class="stat"><b id="st-best">0</b><span id="lbl-st-best">최고</span></div>
  </div>
  <h4 id="st-dist-title">추측 분포</h4>
  <div id="st-dist" class="dist"></div>
  <p id="st-mode-note" class="mode-info"></p>
</section>

<!-- 설정 -->
<section id="settings-modal" class="modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <button class="modal-close" aria-label="닫기"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-close"/></svg></button>
  <h3 id="settings-title">설정</h3>

  <h4 id="grp-general">일반</h4>
  <div class="set-row">
    <label class="set-switch" for="sound">
      <span id="lbl-sound">소리</span>
      <input type="checkbox" id="sound" />
      <span class="switch-track"></span>
    </label>
    <label class="set-switch" for="lang-toggle">
      <span id="lbl-lang">언어</span>
      <span class="lang-badge" id="lang-label">EN</span>
      <input type="checkbox" id="lang-toggle" />
      <span class="switch-track"></span>
    </label>
  </div>
  <div class="set-row hints-row">
    <span id="lbl-hints" class="set-label">힌트 표시</span>
    <label class="check-item" for="hint-rank"><input type="checkbox" id="hint-rank" /> <span id="lbl-hint-rank">랭크</span></label>
    <label class="check-item" for="hint-tribe"><input type="checkbox" id="hint-tribe" /> <span id="lbl-hint-tribe">부족</span></label>
    <label class="check-item" for="hint-attr"><input type="checkbox" id="hint-attr" /> <span id="lbl-hint-attr">속성</span></label>
  </div>
  <div class="set-row">
    <button id="reset-settings" class="btn-ghost">기본값 복원</button>
  </div>

  <h4 id="grp-game">게임</h4>
  <div class="set-row sel-row">
    <select id="game-select" class="select-input"></select>
    <select id="version-select" class="select-input"></select>
  </div>

  <h4 id="grp-dex">포획 도감</h4>
  <input id="dex-search" type="search" class="text-input" placeholder="요괴 검색..." />
  <div id="dex-progress" class="dex-progress" hidden>
    <div id="dex-progress-bar" class="dex-progress-bar"></div>
  </div>
  <span id="dex-progress-label" class="dex-progress-label"></span>
  <div id="dex-grid" class="dex-grid"></div>
</section>

<canvas id="confetti" class="confetti"></canvas>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
